{{ if and (.Params.comments | default .Site.Params.enableComments) (eq hugo.Environment "production") }}
    {{ if or (in .Site.Params.mainSections .Section) .Params.comments }}
        {{ if .Site.Params.enableArtalk }}
            <br/>
            <link rel="stylesheet" href="https://{{ .Site.Params.artalkServer }}/dist/ArtalkLite.css">
            <style>
                .artalk {
                    --at-color-main: #8d78eb
                }
            </style>
            <div id="atk_comments"></div>
            <script src="https://{{ .Site.Params.artalkServer }}/dist/ArtalkLite.js"></script>
            <script>
                Artalk.init({
                    el: "#atk_comments",
                    server: "https://{{ .Site.Params.artalkServer }}",
                    site: "{{ .Site.Params.artalkSite }}",
                    darkMode: "auto",
                    pageKey: window.location.pathname.replace(/\/$/,'')
                });
            </script>
        {{ end }}
    {{ end }}
{{ end }}
